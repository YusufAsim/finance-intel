user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 10m;

    upstream backend_upstream {
        server backend:8000;
    }

    upstream ml_upstream {
        server ml:8000;
    }

    upstream agentic_upstream {
        server agentic:8000;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    server {
        listen 80;
        server_name _;

        # proxy health, answered by nginx itself
        location = /healthz {
            default_type application/json;
            return 200 '{"status": "ok"}';
        }

        location /api/ {
            proxy_pass http://backend_upstream/api/;
        }

        location = /api/healthz {
            proxy_pass http://backend_upstream/healthz;
        }

        location /admin/ {
            proxy_pass http://backend_upstream/admin/;
        }

        location /static/ {
            proxy_pass http://backend_upstream/static/;
        }

        location /ml/ {
            proxy_pass http://ml_upstream/;
        }

        location = /ml/healthz {
            proxy_pass http://ml_upstream/healthz;
        }

        location / {
            proxy_pass http://agentic_upstream/;
        }
    }
}
